name: Publish B4.2 after merge

on:
  push:
    branches:
      - release/b4-2-publish-after-merge

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          git checkout origin/main -- .
          grep -q '^## Version: 3.3.8-v57.8-B4.2$' Roth_UI.toc

      - name: Install validation toolchain
        run: sudo apt-get update && sudo apt-get install --yes lua5.1 unzip

      - name: Revalidate exact main runtime source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_addon.py
          python3 tools/validate_release.py
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
          lua5.1 tests/test_castbar_interruptibility.lua
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!Libs/**'; then
            echo 'merge conflict marker found' >&2
            exit 1
          fi

      - name: Build deterministic clean package twice
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.3.8-v57.8-B4.2'
          mkdir -p dist/a dist/b dist/final
          python3 tools/package_addon.py --output "dist/a/Roth_UI-${VERSION}.zip"
          python3 tools/package_addon.py --output "dist/b/Roth_UI-${VERSION}.zip"
          cmp "dist/a/Roth_UI-${VERSION}.zip" "dist/b/Roth_UI-${VERSION}.zip"
          cp "dist/a/Roth_UI-${VERSION}.zip" "dist/final/Roth_UI-${VERSION}.zip"
          python3 tools/package_addon.py --output /tmp/not-used.zip --verify "dist/final/Roth_UI-${VERSION}.zip"
          sha256sum "dist/final/Roth_UI-${VERSION}.zip" | tee dist/final/SHA256SUMS.txt
          unzip -Z1 "dist/final/Roth_UI-${VERSION}.zip" | tee dist/final/ZIP-CONTENTS.txt
          if grep -Eqi '(^|/)(todo([^/]*)?|audit([^/]*)?|history([^/]*)?|readme([^/]*)?|agent_guide([^/]*)?|architecture([^/]*)?|code_(graph|index)([^/]*)?|current_status([^/]*)?|midnight_[^/]*|tools|tests|\.github)(/|$)' dist/final/ZIP-CONTENTS.txt; then
            echo 'service or development file leaked into release ZIP' >&2
            exit 1
          fi

      - name: Publish release at exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='3.3.8-v57.8-B4.2'
          TAG="v${VERSION}"
          ZIP="dist/final/Roth_UI-${VERSION}.zip"
          git tag --force "$TAG" "$MAIN_SHA"
          git push origin "refs/tags/$TAG" --force

          NOTES=$(mktemp)
          cat > "$NOTES" <<EOF
          Roth UI ${VERSION} for World of Warcraft Retail / Midnight 12.1.0, Interface 120100.

          Source/static verification completed:
          - one first-party owner may replace Roth_UI_DB and Roth_UI_DB_Char;
          - Settings category registration and runtime settings actions have explicit, non-competing owners;
          - target and focus castbars use the exact oUF 14 interruptibility callbacks;
          - interruptibility is forwarded to native conditional widget sinks without Lua branching;
          - active first-party code has no raw aura scanner or addon-owned UNIT_AURA registration;
          - the deterministic ZIP contains runtime files, assets, license and credits only;
          - TODO, audits, repository documentation, CI, tools and tests are excluded.

          In-client combat, taint and visual certification remains a separate required test matrix.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" dist/final/SHA256SUMS.txt dist/final/ZIP-CONTENTS.txt --clobber
            gh release edit "$TAG" --title "Roth UI ${VERSION}" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "$ZIP" dist/final/SHA256SUMS.txt dist/final/ZIP-CONTENTS.txt \
              --target "$MAIN_SHA" \
              --title "Roth UI ${VERSION}" \
              --notes-file "$NOTES" \
              --latest
          fi

      - name: Upload retained evidence
        uses: actions/upload-artifact@v4
        with:
          name: roth-ui-b4-2-after-merge-${{ env.MAIN_SHA }}
          path: dist/final/
          if-no-files-found: error
          retention-days: 90

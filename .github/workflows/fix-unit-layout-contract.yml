name: Fix unit-layout media contract

on:
  push:
    branches:
      - audit/persistence-runtime-3.4.3

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-unit-layout-contract]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update deduplicated texture contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_unit_layout.lua")
          text = path.read_text(encoding="utf-8")
          old = '''same(targetTarget.textures[1].texture, "Interface\\\\AddOns\\\\Roth_UI\\\\media\\\\targettarget",
            "targettarget artwork texture")'''
          new = '''-- targettarget.tga was byte-identical to target.tga; retain the canonical asset.
          same(targetTarget.textures[1].texture, "Interface\\\\AddOns\\\\Roth_UI\\\\media\\\\target",
            "targettarget artwork texture")'''
          if text.count(old) != 1:
              raise SystemExit("expected targettarget texture assertion was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm -f .github/workflows/fix-unit-layout-contract.yml
          git diff --check

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Commit candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align unit-layout regression with deduplicated media"

      - name: Validate exact committed source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository_text.py
          python3 tools/validate_addon.py
          python3 tools/validate_group_visibility.py
          python3 tools/validate_runtime_hardening.py
          python3 tools/run_lua_tests.py --lua lua5.1 --luac luac5.1
          version="$(sed -n 's/^## Version:[[:space:]]*//p' Roth_UI.toc)"
          mkdir -p /tmp/dist-a /tmp/dist-b
          python3 tools/package_release.py "/tmp/dist-a/Roth_UI-${version}.zip"
          python3 tools/package_release.py "/tmp/dist-b/Roth_UI-${version}.zip"
          cmp "/tmp/dist-a/Roth_UI-${version}.zip" "/tmp/dist-b/Roth_UI-${version}.zip"

      - name: Push verified source
        shell: bash
        run: git push origin HEAD:audit/persistence-runtime-3.4.3

name: Verify and merge B4.2 v3

on:
  push:
    branches:
      - codex/roth-ui-final-b4-2-v3-20260828
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: roth-ui-b4-2-v3
  cancel-in-progress: false

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out final branch
        uses: actions/checkout@v4
        with:
          ref: codex/roth-ui-final-b4-2-v3-20260828
          fetch-depth: 0

      - name: Resolve whether a v3 pull request is already merged
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NUMBER=$(gh pr list --head codex/roth-ui-final-b4-2-v3-20260828 --base main --state merged --json number --jq '.[0].number // empty')
          if test -n "$NUMBER"; then
            echo 'merged=true' >> "$GITHUB_OUTPUT"
          else
            echo 'merged=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Import audited B4.2 work and repair migration edge cases
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin codex/roth-ui-final-b4-2-20260828:refs/remotes/origin/codex/roth-ui-final-b4-2-20260828
          git merge --squash --no-commit origin/codex/roth-ui-final-b4-2-20260828 || {
            git status --short
            exit 1
          }

          if grep -q '^## Version: 3.3.8-v57.8-B4.1$' Roth_UI.toc; then
            if ! test -f .github/scripts/apply_b4_2.py; then
              SOURCE_COMMIT=$(git log origin/codex/roth-ui-final-b4-2-20260828 --format='%H' -- .github/scripts/apply_b4_2.py | head -n 1)
              test -n "$SOURCE_COMMIT"
              mkdir -p .github/scripts
              git show "$SOURCE_COMMIT:.github/scripts/apply_b4_2.py" > .github/scripts/apply_b4_2.py
            fi
            python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_b4_2.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '(?:RegisterEvent|RegisterUnitEvent|UnregisterEvent)',
              '(?:RegisterEvent|RegisterUnitEvent)',
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
            python3 .github/scripts/apply_b4_2.py
          fi

          grep -q '^## Version: 3.3.8-v57.8-B4.2$' Roth_UI.toc

          python3 - <<'PY'
          from pathlib import Path
          import re

          guard = Path('core/aura_runtime_12_1_guard.lua')
          if not guard.is_file():
              raise SystemExit('core/aura_runtime_12_1_guard.lua is missing')
          text = guard.read_text(encoding='utf-8-sig')
          replacement = '''local function DetachLegacyUnitAuraCallback(frame)\n  if frame and type(frame.UnregisterEvent) == "function" then\n    frame:UnregisterEvent("UNIT_AURA", DetachLegacyUnitAuraCallback)\n  end\nend'''
          pattern = re.compile(
              r'local function DetachLegacyUnitAuraCallback\(frame\).*?\nend',
              re.S,
          )
          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
          else:
              marker = 'func.QueueGroupAuraColorUpdate = DetachLegacyUnitAuraCallback'
              if marker not in text:
                  raise SystemExit('cannot restore legacy UNIT_AURA detachment callback')
              text = text.replace(marker, replacement + '\n\n' + marker, 1)
          guard.write_text(text, encoding='utf-8', newline='\n')

          workflow = Path('.github/workflows/addon-static-validation.yml')
          if not workflow.is_file():
              raise SystemExit('release workflow is missing')
          content = workflow.read_text(encoding='utf-8')
          content = content.replace('git diff --check HEAD^ HEAD || true', 'git diff --check')
          workflow.write_text(content, encoding='utf-8', newline='\n')
          PY

          rm -f _probe_do_not_keep.txt _branch_marker.txt STOP.txt oops.txt
          rm -f .github/scripts/apply_b4_2.py
          rm -f .github/workflows/apply-b4-2.yml
          rm -f .github/workflows/finalize-b4-2.yml
          rm -f .github/workflows/verify-merge-b4-2.yml
          rm -f .github/workflows/verify-merge-b4-2-v2.yml
          rm -f .github/workflows/verify-merge-b4-2-v3.yml
          rm -f .github/workflows/source-audit-snapshot.yml

      - name: Commit exact v3 tree under test
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize corrected B4.2 source, ownership and release packaging'
            git push origin HEAD:codex/roth-ui-final-b4-2-v3-20260828
          fi
          test -z "$(git status --porcelain=v1)"

      - name: Install exact validation toolchain
        if: steps.state.outputs.merged != 'true'
        run: sudo apt-get update && sudo apt-get install --yes lua5.1 unzip

      - name: Validate source graph, ownership and castbar behavior
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_addon.py
          python3 tools/validate_release.py
          git diff --check
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
          lua5.1 tests/test_castbar_interruptibility.lua
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!Libs/**'; then
            echo 'merge conflict marker found' >&2
            exit 1
          fi

      - name: Build and inspect deterministic clean release ZIP
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^## Version:[[:space:]]*//p' Roth_UI.toc)
          test "$VERSION" = '3.3.8-v57.8-B4.2'
          mkdir -p dist/a dist/b dist/final
          python3 tools/package_addon.py --output "dist/a/Roth_UI-${VERSION}.zip"
          python3 tools/package_addon.py --output "dist/b/Roth_UI-${VERSION}.zip"
          cmp "dist/a/Roth_UI-${VERSION}.zip" "dist/b/Roth_UI-${VERSION}.zip"
          cp "dist/a/Roth_UI-${VERSION}.zip" "dist/final/Roth_UI-${VERSION}.zip"
          python3 tools/package_addon.py --output /tmp/not-used.zip --verify "dist/final/Roth_UI-${VERSION}.zip"
          sha256sum "dist/final/Roth_UI-${VERSION}.zip" | tee dist/final/SHA256SUMS.txt
          unzip -Z1 "dist/final/Roth_UI-${VERSION}.zip" | tee dist/final/ZIP-CONTENTS.txt
          if grep -Eqi '(^|/)(todo([^/]*)?|audit([^/]*)?|history([^/]*)?|readme([^/]*)?|agent_guide([^/]*)?|architecture([^/]*)?|code_(graph|index)([^/]*)?|current_status([^/]*)?|midnight_[^/]*|tools|tests|\.github)(/|$)' dist/final/ZIP-CONTENTS.txt; then
            echo 'service or development file leaked into release ZIP' >&2
            exit 1
          fi

      - name: Upload final verification evidence
        if: steps.state.outputs.merged != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roth-ui-b4-2-v3-${{ github.sha }}
          path: dist/final/
          if-no-files-found: error
          retention-days: 30

      - name: Resolve or create v3 pull request
        if: steps.state.outputs.merged != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NUMBER=$(gh pr list --head codex/roth-ui-final-b4-2-v3-20260828 --base main --state open --json number --jq '.[0].number // empty')
          if test -z "$NUMBER"; then
            gh pr create \
              --base main \
              --head codex/roth-ui-final-b4-2-v3-20260828 \
              --title 'Correct Retail 12.1 ownership, interruptibility and clean B4.2 release' \
              --body 'Final source/static gate: one SavedVariables writer, exact oUF 14 interruptibility callbacks with native secret-safe sinks, no active raw aura scanner, address-specific legacy callback detachment, Lua 5.1 regression coverage, and deterministic runtime-only ZIP.'
            NUMBER=$(gh pr list --head codex/roth-ui-final-b4-2-v3-20260828 --base main --state open --json number --jq '.[0].number // empty')
          fi
          test -n "$NUMBER"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge only after all v3 checks pass
        if: steps.state.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash --admin \
            --subject 'Correct Retail 12.1 ownership, interruptibility and clean B4.2 release' \
            --body 'Passed Lua 5.1 parsing, single-writer ownership, managed-aura boundary, address-specific event detachment, castbar interruptibility regression, deterministic package comparison, and clean-ZIP content audit.'

name: Verify and merge B4.2 v2

on:
  push:
    branches:
      - codex/roth-ui-final-b4-2-20260828
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: roth-ui-b4-2-verify-merge-v2
  cancel-in-progress: false

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out audited branch
        uses: actions/checkout@v4
        with:
          ref: codex/roth-ui-final-b4-2-20260828
          fetch-depth: 0

      - name: Resolve current pull request state
        id: prstate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MERGED=$(gh pr list --head codex/roth-ui-final-b4-2-20260828 --base main --state merged --json number --jq '.[0].number // empty')
          if test -n "$MERGED"; then
            echo 'merged=true' >> "$GITHUB_OUTPUT"
          else
            echo 'merged=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Complete migration and remove temporary orchestration
        if: steps.prstate.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## Version: 3.3.8-v57.8-B4.1$' Roth_UI.toc; then
            test -f .github/scripts/apply_b4_2.py
            python3 .github/scripts/apply_b4_2.py
          fi
          grep -q '^## Version: 3.3.8-v57.8-B4.2$' Roth_UI.toc

          rm -f _probe_do_not_keep.txt _branch_marker.txt STOP.txt oops.txt
          rm -f .github/scripts/apply_b4_2.py
          rm -f .github/workflows/apply-b4-2.yml
          rm -f .github/workflows/finalize-b4-2.yml
          rm -f .github/workflows/verify-merge-b4-2.yml
          rm -f .github/workflows/verify-merge-b4-2-v2.yml

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/addon-static-validation.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('git diff --check HEAD^ HEAD || true', 'git diff --check')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit the exact tree that will be validated
        if: steps.prstate.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git diff --cached --check
            git commit -m 'Finalize exact B4.2 verification tree'
            git push origin HEAD:codex/roth-ui-final-b4-2-20260828
          fi
          test -z "$(git status --porcelain=v1)"

      - name: Install exact validation tools
        if: steps.prstate.outputs.merged != 'true'
        run: sudo apt-get update && sudo apt-get install --yes lua5.1 unzip

      - name: Validate source, ownership and callback contracts
        if: steps.prstate.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_addon.py
          python3 tools/validate_release.py
          git diff --check
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
          lua5.1 tests/test_castbar_interruptibility.lua
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!Libs/**'; then
            echo 'merge conflict marker found' >&2
            exit 1
          fi

      - name: Build and inspect deterministic runtime ZIP
        if: steps.prstate.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^## Version:[[:space:]]*//p' Roth_UI.toc)
          test "$VERSION" = '3.3.8-v57.8-B4.2'
          mkdir -p dist/a dist/b dist/final
          python3 tools/package_addon.py --output "dist/a/Roth_UI-${VERSION}.zip"
          python3 tools/package_addon.py --output "dist/b/Roth_UI-${VERSION}.zip"
          cmp "dist/a/Roth_UI-${VERSION}.zip" "dist/b/Roth_UI-${VERSION}.zip"
          cp "dist/a/Roth_UI-${VERSION}.zip" "dist/final/Roth_UI-${VERSION}.zip"
          python3 tools/package_addon.py --output /tmp/not-used.zip --verify "dist/final/Roth_UI-${VERSION}.zip"
          sha256sum "dist/final/Roth_UI-${VERSION}.zip" | tee dist/final/SHA256SUMS.txt
          unzip -Z1 "dist/final/Roth_UI-${VERSION}.zip" | tee dist/final/ZIP-CONTENTS.txt
          if grep -Eqi '(^|/)(todo([^/]*)?|audit([^/]*)?|history([^/]*)?|readme([^/]*)?|agent_guide([^/]*)?|architecture([^/]*)?|code_(graph|index)([^/]*)?|current_status([^/]*)?|midnight_[^/]*|tools|tests|\.github)(/|$)' dist/final/ZIP-CONTENTS.txt; then
            echo 'service or development file leaked into release ZIP' >&2
            exit 1
          fi

      - name: Upload verified release evidence
        if: steps.prstate.outputs.merged != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roth-ui-b4-2-final-${{ github.sha }}
          path: dist/final/
          if-no-files-found: error
          retention-days: 30

      - name: Resolve or create exact pull request number
        if: steps.prstate.outputs.merged != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NUMBER=$(gh pr list --head codex/roth-ui-final-b4-2-20260828 --base main --state open --json number --jq '.[0].number // empty')
          if test -z "$NUMBER"; then
            gh pr create \
              --base main \
              --head codex/roth-ui-final-b4-2-20260828 \
              --title 'Finish Retail 12.1 ownership, castbar and clean B4.2 release' \
              --body 'Validated B4.2 source: single SavedVariables owner, managed-aura boundary, exact oUF 14 interruptibility callbacks, Lua 5.1 regression coverage, and deterministic runtime-only ZIP packaging.'
            NUMBER=$(gh pr list --head codex/roth-ui-final-b4-2-20260828 --base main --state open --json number --jq '.[0].number // empty')
          fi
          test -n "$NUMBER"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Squash-merge only the verified commit
        if: steps.prstate.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash --admin \
            --subject 'Finish Retail 12.1 ownership, castbar and clean B4.2 release' \
            --body 'Passed Lua 5.1 parsing, single-writer checks, managed-aura checks, castbar interruptibility regression, deterministic package comparison, and clean-ZIP content audit.'

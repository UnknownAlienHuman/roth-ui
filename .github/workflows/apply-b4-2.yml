name: Apply B4.2 migration

on:
  push:
    branches:
      - codex/roth-ui-final-b4-2-20260828

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[b4.2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: codex/roth-ui-final-b4-2-20260828
          fetch-depth: 0

      - name: Apply asserted source migration
        run: python3 .github/scripts/apply_b4_2.py

      - name: Commit generated B4.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Complete Retail 12.1 ownership, castbar, aura and release hardening [b4.2-applied]'
          git push origin HEAD:codex/roth-ui-final-b4-2-20260828

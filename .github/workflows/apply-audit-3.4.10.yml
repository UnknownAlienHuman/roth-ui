name: Apply Roth UI 3.4.10 audit

on:
  push:
    branches:
      - audit/runtime-ownership-3.4.10

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-audit-3.4.10]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out staging commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and apply audited source overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .audit/part-* | base64 --decode > /tmp/roth-overlay.tar.xz
          echo "62302bbcf935917b9400e63ccabd70fc3989005fdff85d5b272c21848de02202  /tmp/roth-overlay.tar.xz" | sha256sum -c -
          mkdir -p /tmp/roth-overlay
          tar -xJf /tmp/roth-overlay.tar.xz -C /tmp/roth-overlay
          cp -a /tmp/roth-overlay/. .
          rm -rf .audit

          python3 - <<'PY'
          from pathlib import Path

          # The audited runtime intentionally retires the unused Park alias.
          runtime = Path("core/group_header_visibility.lua").read_text(encoding="utf-8")
          if "function service.Park" not in runtime:
              replacements = {
                  Path("tools/validate_addon.py"): '        "function service.Park",\n',
                  Path("tools/validate_group_visibility.py"): "        'function service.Park(frame)',\n",
              }
              for path, stale in replacements.items():
                  text = path.read_text(encoding="utf-8")
                  if stale in text:
                      path.write_text(text.replace(stale, "", 1), encoding="utf-8")

          # Flat mover aliases were retired; regressions exercise moverRuntime.
          mover_test_path = Path("tests/test_mover_input_safety.lua")
          mover_test = mover_test_path.read_text(encoding="utf-8")
          mover_test_path.write_text(
              mover_test.replace("ns.ApplySavedMoverLayout", "ns.moverRuntime.ApplySavedLayout"),
              encoding="utf-8",
          )

          # target_castbar now requires the sole next-frame scheduler at load.
          castbar_test_path = Path("tests/test_target_castbar_cache.lua")
          castbar_test = castbar_test_path.read_text(encoding="utf-8")
          stale = "local ns = {}\n"
          replacement = (
              "local ns = {\n"
              "  defer = { RunNextFrame = function() return true end },\n"
              "}\n"
          )
          if stale in castbar_test:
              castbar_test_path.write_text(castbar_test.replace(stale, replacement, 1), encoding="utf-8")
          PY

          git add -A
          git diff --cached --check
          git diff --cached --stat

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 xz-utils

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository_text.py
          python3 tools/validate_addon.py
          python3 tools/validate_group_visibility.py
          python3 tools/validate_runtime_hardening.py
          python3 tools/run_lua_tests.py --lua lua5.1 --luac luac5.1
          git diff --cached --check
          version="$(sed -n 's/^## Version:[[:space:]]*//p' Roth_UI.toc)"
          mkdir -p /tmp/dist-a /tmp/dist-b
          python3 tools/package_release.py "/tmp/dist-a/Roth_UI-${version}.zip"
          python3 tools/package_release.py "/tmp/dist-b/Roth_UI-${version}.zip"
          cmp "/tmp/dist-a/Roth_UI-${version}.zip" "/tmp/dist-b/Roth_UI-${version}.zip"

      - name: Preserve exact candidate for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Roth_UI-3.4.10-candidate-${{ github.sha }}
          path: |
            .
            !.git/**
            !.audit/**
          include-hidden-files: true
          retention-days: 7

      - name: Publish validated source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No source changes to publish." >&2; exit 1; }
          git commit -m "Harden Roth UI 3.4.10 runtime ownership"
          git push origin HEAD:audit/runtime-ownership-3.4.10

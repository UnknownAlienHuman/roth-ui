name: Apply Roth UI audit-3

on:
  push:
    branches: [audit/persistence-runtime-3.4.3]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-audit3]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source lineage
        run: git merge-base --is-ancestor 55f1a68848d8a9b28ed494d8310ea7918c34caef HEAD
      - name: Download verified overlay
        env:
          OVERLAY_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-02c0-81f6-bb48-90441f239a4c/raw?se=2026-11-04T23%3A54%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=30e646f0-82d3-5c29-9b6d-61b3f4a7aacc&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T21%3A11%3A41Z&ske=2026-11-05T21%3A11%3A41Z&sks=b&skv=2026-02-06&sig=EuV2DBpADvAh4INVXNUHZn4iptbAKL%2BmgaPpPZOZBhI%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$OVERLAY_URL" -o /tmp/audit3.zip
          echo "54de3422fda3e9600a3796fe53c09f33903e5df842912aa5781437c11b9f22cd  /tmp/audit3.zip" | sha256sum -c --strict
          mkdir -p /tmp/audit3
          unzip -q /tmp/audit3.zip -d /tmp/audit3
      - name: Apply overlay and fixture corrections
        run: |
          set -euo pipefail
          python3 /tmp/audit3/Roth_UI-3.4.3-audit3-source-overlay/apply_overlay.py . --force
          python3 - <<'PY'
          from pathlib import Path
          def rep(name, old, new):
              p = Path(name); s = p.read_text(encoding="utf-8")
              if s.count(old) != 1: raise SystemExit(f"{name}: expected one match for {old!r}, got {s.count(old)}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
          rep("tools/validate_addon.py", '"14.1.1", "AddElement"', 'OUF_MIN, "AddElement"')
          rep("tests/test_aura_lazy.lua",
              '  framePolicy = {\n    DeferUntilOutOfCombat = function(key, callback)\n      deferred = callback\n      return true\n    end,\n  },',
              '  framePolicy = {\n    DeferUntilOutOfCombat = function(key, callback)\n      deferred = callback\n      return true\n    end,\n    DeferForObject = function(scope, object, callback)\n      deferred = callback\n      return true\n    end,\n  },')
          rep("tests/test_unit_helpers.lua",
              '  framePolicy = { DeferUntilOutOfCombat = function(_, callback) deferred = callback return true end },',
              '  framePolicy = {\n    DeferUntilOutOfCombat = function(_, callback) deferred = callback return true end,\n    DeferForObject = function(_, _, callback) deferred = callback return true end,\n  },')
          rep("tests/test_mover_runtime.lua",
              '  framePolicy = { DeferUntilOutOfCombat = function() return false end },',
              '  framePolicy = {\n    DeferUntilOutOfCombat = function() return false end,\n    DeferForObject = function() return false end,\n  },')
          rep("tests/test_unit_layout.lua",
              '  framePolicy = {\n    DeferUntilOutOfCombat = function(key, callback)\n      if not inCombat then return false end\n      deferredWork[key] = callback\n      return true\n    end,\n  },',
              '  framePolicy = {\n    DeferUntilOutOfCombat = function(key, callback)\n      if not inCombat then return false end\n      deferredWork[key] = callback\n      return true\n    end,\n    DeferForObject = function(scope, object, callback)\n      if not inCombat then return false end\n      deferredWork[scope .. ":" .. tostring(object)] = callback\n      return true\n    end,\n  },')
          PY
          rm -f .github/workflows/apply-roth-third-pass.yml
          git diff --check
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Commit and publish candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Complete Roth UI 3.4.3 audit-3 hardening"
          git push origin HEAD:audit/persistence-runtime-3.4.3
      - name: Validate exact published tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/audit/persistence-runtime-3.4.3 | cut -f1)"
          git diff --check HEAD^..HEAD
          python3 tools/validate_repository_text.py
          python3 tools/validate_addon.py
          python3 tools/validate_group_visibility.py
          python3 tools/validate_runtime_hardening.py
          python3 tools/run_lua_tests.py --lua lua5.1 --luac luac5.1
          version="$(sed -n 's/^## Version:[[:space:]]*//p' Roth_UI.toc)"
          test "$version" = "3.4.3"
          mkdir -p /tmp/dist-a /tmp/dist-b
          python3 tools/package_release.py "/tmp/dist-a/Roth_UI-${version}.zip"
          python3 tools/package_release.py "/tmp/dist-b/Roth_UI-${version}.zip"
          cmp "/tmp/dist-a/Roth_UI-${version}.zip" "/tmp/dist-b/Roth_UI-${version}.zip"
          unzip -t "/tmp/dist-a/Roth_UI-${version}.zip"

name: Apply Roth UI audit-3

on:
  push:
    branches:
      - audit/persistence-runtime-3.4.3

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-audit3]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 55f1a68848d8a9b28ed494d8310ea7918c34caef HEAD

      - name: Download and verify audit overlay
        shell: bash
        env:
          OVERLAY_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-6658-81f6-a554-77049bd8c053/raw?se=2026-11-04T23%3A38%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=2bbe82d5-ee61-5da1-8eab-b29e7cb6989e&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T21%3A12%3A07Z&ske=2026-11-05T21%3A12%3A07Z&sks=b&skv=2026-02-06&sig=t8VyQWRCJQmqX7JHx6fqXRo2XsIw7b6zpTLjTiVcoFw%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$OVERLAY_URL" --output /tmp/audit3.zip
          echo "54de3422fda3e9600a3796fe53c09f33903e5df842912aa5781437c11b9f22cd  /tmp/audit3.zip" | sha256sum --check --strict
          mkdir -p /tmp/audit3
          unzip -q /tmp/audit3.zip -d /tmp/audit3

      - name: Apply exact overlay and validator correction
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/audit3/Roth_UI-3.4.3-audit3-source-overlay/apply_overlay.py . --force
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/validate_addon.py")
          text = path.read_text(encoding="utf-8")
          old = 'for token in ("14.1.1", "AddElement", "RegisterStyle", "SpawnHeader", "AuraContainerSortMethod"):'
          new = 'for token in (OUF_MIN, "AddElement", "RegisterStyle", "SpawnHeader", "AuraContainerSortMethod"):'
          if text.count(old) != 1:
              raise SystemExit(f"expected one stale oUF validator token, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/apply-roth-third-pass.yml
          git diff --check

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Commit exact candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "Audit overlay produced no changes." >&2; exit 1; }
          git commit -m "Complete Roth UI 3.4.3 audit-3 hardening"

      - name: Validate exact committed source tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^..HEAD
          python3 tools/validate_repository_text.py
          python3 tools/validate_addon.py
          python3 tools/validate_group_visibility.py
          python3 tools/validate_runtime_hardening.py
          python3 tools/run_lua_tests.py --lua lua5.1 --luac luac5.1

          version="$(sed -n 's/^## Version:[[:space:]]*//p' Roth_UI.toc)"
          test "$version" = "3.4.3"
          mkdir -p /tmp/dist-a /tmp/dist-b
          python3 tools/package_release.py "/tmp/dist-a/Roth_UI-${version}.zip"
          python3 tools/package_release.py "/tmp/dist-b/Roth_UI-${version}.zip"
          cmp "/tmp/dist-a/Roth_UI-${version}.zip" "/tmp/dist-b/Roth_UI-${version}.zip"
          unzip -t "/tmp/dist-a/Roth_UI-${version}.zip"

      - name: Push verified source
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:audit/persistence-runtime-3.4.3

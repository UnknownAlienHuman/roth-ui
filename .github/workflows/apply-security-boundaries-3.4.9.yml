name: Apply Roth UI 3.4.9 security audit

on:
  push:
    branches:
      - audit/security-boundaries-3.4.9

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-security-3.4.9]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9b257c4c934e2adff501f9fd4d12d31258ad5691"
          echo "34cfe527d53244250ec8494ffd8377bfda51bb6f15bbb5e819bb348026ce7bfd  .audit_overlay/payload.tar.xz" | sha256sum -c -
          tar -xJf .audit_overlay/payload.tar.xz -C .
          rm -rf .audit_overlay
          rm -f .github/workflows/apply-security-boundaries-3.4.9.yml
          git add -A
          git diff --cached --check

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Validate exact final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository_text.py
          python3 tools/validate_addon.py
          python3 tools/validate_group_visibility.py
          python3 tools/validate_runtime_hardening.py
          python3 tools/run_lua_tests.py --lua lua5.1 --luac luac5.1
          version="$(sed -n 's/^## Version:[[:space:]]*//p' Roth_UI.toc)"
          test "$version" = "3.4.9"
          mkdir -p /tmp/dist-a /tmp/dist-b
          python3 tools/package_release.py "/tmp/dist-a/Roth_UI-${version}.zip"
          python3 tools/package_release.py "/tmp/dist-b/Roth_UI-${version}.zip"
          cmp "/tmp/dist-a/Roth_UI-${version}.zip" "/tmp/dist-b/Roth_UI-${version}.zip"

      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden Roth UI 3.4.9 security and runtime ownership"
          git push origin HEAD:audit/security-boundaries-3.4.9

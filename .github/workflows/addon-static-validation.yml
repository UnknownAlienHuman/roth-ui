name: Addon validation and package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the B4.3.4 GitHub release after validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Validate repository text policy
        run: python3 tools/validate_repository_text.py

      - name: Validate load graph, ownership and Retail 12.1 boundaries
        run: python3 tools/validate_addon.py

      - name: Validate exact secure-header visibility semantics
        run: python3 tools/validate_group_visibility.py

      - name: Validate lazy Settings and action-button hardening
        run: python3 tools/validate_runtime_hardening.py

      - name: Parse all Lua 5.1 sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)

      - name: Run isolated regression tests
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 tests/test_safety.lua
          lua5.1 tests/test_safety_aspects.lua
          lua5.1 tests/test_frame_policy.lua
          lua5.1 tests/test_ouf_contract.lua
          lua5.1 tests/test_target_castbar.lua
          lua5.1 tests/test_aura_lazy.lua
          lua5.1 tests/test_combat_fader.lua
          lua5.1 tests/test_group_header_visibility.lua
          lua5.1 tests/test_settings_lifecycle.lua
          lua5.1 tests/test_action_button_skin.lua
          lua5.1 tests/test_minimap_button.lua
          lua5.1 tests/test_action_bar_background.lua

      - name: Reject whitespace and conflict-marker errors
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          fi
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'; then
            echo 'Merge-conflict markers found.' >&2
            exit 1
          fi

      - name: Build deterministic runtime package twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-a dist-b dist
          python3 tools/package_release.py "dist-a/Roth_UI-3.3.8-v57.8-B4.3.4.zip"
          python3 tools/package_release.py "dist-b/Roth_UI-3.3.8-v57.8-B4.3.4.zip"
          cmp "dist-a/Roth_UI-3.3.8-v57.8-B4.3.4.zip" "dist-b/Roth_UI-3.3.8-v57.8-B4.3.4.zip"
          cp "dist-a/Roth_UI-3.3.8-v57.8-B4.3.4.zip" dist/
          (cd dist && sha256sum Roth_UI-3.3.8-v57.8-B4.3.4.zip > SHA256SUMS.txt)
          unzip -Z1 dist/Roth_UI-3.3.8-v57.8-B4.3.4.zip > dist/ZIP-CONTENTS.txt

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Roth_UI-3.3.8-v57.8-B4.3.4
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: Roth_UI-3.3.8-v57.8-B4.3.4
          path: dist

      - name: Publish B4.3.4 release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.3.8-v57.8-B4.3.4
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          cat > RELEASE_NOTES.md <<'NOTES'
          ## Roth UI 3.3.8-v57.8-B4.3.4

          Retail/Midnight 12.1 secure lifecycle and runtime hardening update.

          - validated against live Blizzard UI baseline `12.1.0.69933`;
          - requires current oUF 14.1.1 or newer;
          - keeps each party/raid secure header session-owned instead of rebuilding protected headers from Settings;
          - stores desired/applied secure-header visibility in addon-owned weak metadata;
          - centralizes post-combat callbacks in one coalescing event queue;
          - structural party/raid options are persisted as reload-required changes;
          - Blizzard Settings pages register lazily without forcing `Blizzard_Settings` to load at login;
          - action-button skinning checks access and operation-specific forbidden aspects before mutating Blizzard regions;
          - validates these contracts with dedicated static and Lua regression guards;
          - produces one deterministic runtime-only `Roth_UI` addon directory.

          Source/static validation passed on the tagged commit. Retail-client combat, taint, party/raid transition and visual validation remain a separate acceptance gate.
          NOTES

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Roth UI 3.3.8-v57.8-B4.3.4" \
            --notes-file RELEASE_NOTES.md \
            dist/Roth_UI-3.3.8-v57.8-B4.3.4.zip \
            dist/SHA256SUMS.txt \
            dist/ZIP-CONTENTS.txt

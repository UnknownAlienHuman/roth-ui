name: Addon static validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate TOC, XML closure, load order, and 12.1 aura boundary
        run: python3 tools/validate_addon.py

      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse all Lua sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find . -type f -name '*.lua' -print0)

      - name: Reject whitespace and conflict-marker errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}"..HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check --cached
          fi
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'; then
            echo 'Merge-conflict markers found.' >&2
            exit 1
          fi

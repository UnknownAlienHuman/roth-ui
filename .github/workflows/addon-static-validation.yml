name: Addon validation and package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release after validation
        required: false
        default: false
        type: boolean

concurrency:
  group: addon-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read addon version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re

          toc = pathlib.Path("Roth_UI.toc").read_text(encoding="utf-8")
          versions = re.findall(r"^## Version:\s*(\S+)\s*$", toc, re.MULTILINE)
          if len(versions) != 1 or not re.fullmatch(r"\d+\.\d+\.\d+(?:[-.][\w.-]+)?", versions[0]):
              raise SystemExit("Roth_UI.toc must declare exactly one valid release version")
          print(f"version={versions[0]}")
          PY

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Validate repository text policy
        run: python3 tools/validate_repository_text.py

      - name: Validate load graph, ownership and Retail boundaries
        run: python3 tools/validate_addon.py

      - name: Validate exact secure-header visibility semantics
        run: python3 tools/validate_group_visibility.py

      - name: Validate lazy Settings, bounded bootstrap and action-button hardening
        run: python3 tools/validate_runtime_hardening.py

      - name: Parse Lua 5.1 sources and run every regression test
        run: python3 tools/run_lua_tests.py --lua lua5.1 --luac luac5.1

      - name: Reject whitespace and conflict-marker errors
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          fi
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'; then
            echo 'Merge-conflict markers found.' >&2
            exit 1
          fi

      - name: Build deterministic runtime package twice
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive="Roth_UI-${VERSION}.zip"
          mkdir -p dist-a dist-b dist
          python3 tools/package_release.py "dist-a/${archive}"
          python3 tools/package_release.py "dist-b/${archive}"
          cmp "dist-a/${archive}" "dist-b/${archive}"
          cp "dist-a/${archive}" dist/
          (cd dist && sha256sum "${archive}" > SHA256SUMS.txt)
          unzip -Z1 "dist/${archive}" > dist/ZIP-CONTENTS.txt

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Roth_UI
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: Roth_UI
          path: dist

      - name: Publish versioned release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          archive="Roth_UI-${VERSION}.zip"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi

          test -f RELEASE_NOTES.md
          test -f "dist/${archive}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Roth UI ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            "dist/${archive}" \
            dist/SHA256SUMS.txt \
            dist/ZIP-CONTENTS.txt
